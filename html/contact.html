<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Tuny</title>
  <link rel="stylesheet" href="../css/contact.css" />
    <link rel="icon" type="image/png" href="../icon-head.png" />
</head>
<body>

  <!-- ✅ Header -->
  <header class="contact-header">
    <button class="back-btn" onclick="goBack()">
      <img src="../01-contact/back.png" alt="Back">
    </button>
    <a class="booking-btn">You’re Ready for Booking?</a>
  </header>

  <!-- ✅ Contact Section -->
  <section class="contact-section">
    <div class="contact-left">
      <img src="../01-contact/graphic.png" alt="Contact Graphic">
    </div>

    <div class="contact-right">
      <h2>Contact:</h2>

      <div class="contact-item">
        <img src="../01-contact/mail-01.png" alt="Email">
        <span>chientunx.ddv@gmail.com</span>
        <button class="copy-btn" data-copy="chientunx.ddv@gmail.com">
          <img src="../copy.png" alt="Copy">
        </button>
      </div>

      <div class="contact-item">
        <img src="../01-contact/call.png" alt="Phone">
        <span>+84 899 160 012</span>
        <button class="copy-btn" data-copy="0899160012">
          <img src="../copy.png" alt="Copy">
        </button>
      </div>

      <div class="contact-item">
        <img src="../01-contact/location.png" alt="Location">
        <span>Ha Noi, Viet Nam</span>
      </div>

      <div class="socials">
        <h3>Find me Online:</h3>
        <div class="socials-icon">
            <!-- 1 -->
            <a href="https://wa.me/0899160012" target="_blank" class="socials-icon">
                <img src="../socials-icon/what's.png" class="icon-bw" alt="WhatsApp" />
                <img src="../socials-icon/color-apps.png" class="icon-color" alt="WhatsApp" />
            </a>
            <!-- 2 -->
            <a href="https://t.me/chientunx" target="_blank" class="socials-icon">
                <img src="../socials-icon/tele.png" class="icon-bw" alt="WhatsApp" />
                <img src="../socials-icon/color-tele.png" class="icon-color" alt="WhatsApp" />
            </a>
            <!-- 3 -->
            <a href="https://www.facebook.com/TunyDao/" target="_blank" class="socials-icon">
                <img src="../socials-icon/face.png" class="icon-bw" alt="WhatsApp" />
                <img src="../socials-icon/color-face.png" class="icon-color" alt="WhatsApp" />
            </a>
            <!-- 4 -->
            <a href="https://www.instagram.com/tuny_uiux/" target="_blank" class="socials-icon">
                <img src="../socials-icon/ins.png" class="icon-bw" alt="WhatsApp" />
                <img src="../socials-icon/color-ins.png" class="icon-color" alt="WhatsApp" />
            </a>
            <!-- 5 -->
            <a href="https://www.behance.net/chientunx" target="_blank" class="socials-icon">
                <img src="../socials-icon/be.png" class="icon-bw" alt="WhatsApp" />
                <img src="../socials-icon/color-be.png" class="icon-color" alt="WhatsApp" />
            </a>
        </div>
      </div>
    </div>
  </section>

  <script src="../js/script.js"></script>
</body>
</html>
